   <a href="?space=quiz" data-space="quiz"><span class="nav-glyph" aria-hidden="true"><svg class="lumen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg></span><span>看图填空</span></a>

  <div class="rail-caption rail-caption-sub">术语训练</div>

   <a href="?space=learn&view=library" data-space="learn" data-view="library"><svg class="lumen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg><span>术语词库</span></a>
   <a href="?space=learn&view=stats" data-space="learn" data-view="stats"><svg class="lumen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg><span>学习记录</span></a>
  </nav>
  <div class="rail-foot"><span class="online-dot" aria-hidden="true"></span>所有学习记录保留在本机<br><small>一个工作区 · 三种学习方式</small></div>
 </aside>
 <div class="app-column">
  <header class="global-topbar">
   <div class="breadcrumb"><span class="crumb-mark">L</span><span class="crumb-text">LUMEN</span><span class="slash">/</span><strong id="currentSpace">学习概览</strong><span id="currentView"></span></div>
   <div class="topbar-actions">
    <span class="status-chip">学习记录仅存本机</span>
    <button id="themeToggle" class="icon-control" type="button" aria-label="切换深色模式"><svg class="lumen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    <a class="icon-control settings-link" href="?space=learn&amp;view=settings" data-space="learn" data-view="settings" aria-label="设置与备份" title="设置与备份"><svg class="lumen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></a>
    <button id="guideToggle" class="icon-control" type="button" aria-label="使用导览" title="使用导览"></button>
   </div>
  </header>
  <main class="workspace" id="workspace" tabindex="-1">
   <section class="experience editorial-home" id="experience" aria-labelledby="heroTitle">
    <div class="editorial-copy">
     <div class="editorial-kicker">LUMEN / HISTOLOGY</div>
     <h1 id="heroTitle">从组织形态<br>到精准辨认<span>。</span></h1>
     <p>术语复习、切片观察与识图训练，贯通每一次学习。</p>
     <div class="editorial-actions"><button class="primary-action" data-go="learn" data-go-view="review" type="button">到期复习 <span data-icon="arrow-right"></span></button><button class="quiet-action" data-go="quiz" type="button">看图填空 <span data-icon="scan-line"></span></button></div>
    </div>
    <figure class="specimen-feature">
     <div class="slide-composition">
      <div class="glass-sheet sheet-back" aria-hidden="true"></div>
      <div class="glass-sheet sheet-mid" aria-hidden="true"></div>
      <div class="glass-sheet sheet-front">
       <span class="glass-id">LUMEN <small>HISTOLOGY</small></span>
       <div class="micrograph-window"><img id="heroMicrograph" src="https://upload.wikimedia.org/wikipedia/commons/5/54/Renal_corpuscle.jpg" alt="PAS 染色肾小体显微照片" width="1546" height="1201" decoding="async" referrerpolicy="no-referrer"><span class="micrograph-fallback" hidden>肾小体 · PAS</span></div>
       <span class="glass-caption">01 / RENAL CORPUSCLE</span>
      </div>
      <button type="button" class="specimen-link" data-go="atlas">探索切片图谱 <span data-icon="arrow-right"></span></button>
     </div>
     <figcaption>玻片层叠意象 · 非连续切片重建 <a href="https://commons.wikimedia.org/wiki/File:Renal_corpuscle.jpg" target="_blank" rel="noopener noreferrer">Ed Uthman · CC BY-SA 2.0（显微图，裁切展示）</a></figcaption>
    </figure>
   </section>
   <div class="module-bar" id="moduleBar">
    <div class="module-heading"><span class="overline" id="moduleEyebrow">Your workspace</span><h2 id="moduleTitle">学习概览</h2></div>
    <div class="module-tabs" id="moduleTabs" aria-label="当前模块操作"></div>
   </div>
   <div class="module-stage" id="moduleStage" aria-label="学习模块内容" aria-live="off"></div>
   <div id="frameStatus" class="frame-status" role="status" aria-live="polite">准备学习空间…</div>
  </main>
 </div>

  <a href="?space=quiz" data-space="quiz"><svg class="lumen-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg><span>识图</span></a>
 </nav>
</div>
<dialog id="workspaceGuide" class="workspace-guide" aria-labelledby="guideTitle" aria-describedby="guideText">
 <div class="guide-header"><span class="guide-eyebrow">LUMEN / 使用导览</span><button type="button" id="guideClose" class="icon-control" aria-label="关闭导览"></button></div>
 <div class="guide-content"><div class="guide-step-icon" id="guideIcon"></div><span id="guideCount" class="guide-count"></span><h2 id="guideTitle"></h2><p id="guideText"></p><div id="guideProgress" class="guide-progress" role="progressbar" aria-label="导览进度" aria-valuemin="0"></div></div>
 <div class="guide-footer"><button type="button" id="guideSkip" class="guide-quiet">跳过</button><button type="button" id="guideBack" class="guide-quiet">上一步</button><button type="button" id="guideVisit" class="guide-quiet" hidden>前往此处</button><button type="button" id="guideNext" class="guide-primary">开始导览</button></div>
</dialog>
