name: GAMP advisory pilot
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  gamp-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synthetic policy regression tests
        run: node qa/gamp/test.mjs
      - name: Public traceability check (advisory)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node qa/gamp/validate.mjs
